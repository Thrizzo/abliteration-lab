# Kubernetes deployment (deploy/k8s) on throwaway clusters where network policies are enforced.
#   kind      fast: stub console; deploy, network policies, login, RBAC, Isolate and Kill (deploy/k8s/tests/e2e.sh)
#   pipeline  the real console image built from this commit (CPU torch); every pipeline stage as a Job on a tiny GLM,
#             then Promote / Rollback, the kill switch, and copilot runs through real n8n (deploy/k8s/tests/pipeline-e2e.sh)
#   k3s       Rancher Desktop's Kubernetes (k3s in k3d: Traefik, local-path storage, k3s's own network policy controller),
#             set up and checked by the Windows script deploy/k8s/tests/rancher-dev.ps1 under PowerShell 7
name: k8s e2e

on:
  push:
    paths:
      - "deploy/k8s/**"
      - "deploy/Dockerfile"
      - "deploy/requirements.txt"
      - "deploy/entrypoint.sh"
      - "app/**"
      - "abliterate/**"
      - "deploy/n8n/**"
      - "copilot/**"
      - ".github/workflows/k8s-e2e.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: k8s-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install kind
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSLo "$HOME/bin/kind" https://github.com/kubernetes-sigs/kind/releases/download/v0.27.0/kind-linux-amd64
          chmod +x "$HOME/bin/kind"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Create the cluster and install Calico
        run: |
          kind create cluster --name lab --config deploy/k8s/tests/kind-config.yaml --wait 0s
          kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.29.1/manifests/calico.yaml
          kubectl -n kube-system rollout status daemonset/calico-node --timeout=300s
          kubectl wait --for=condition=Ready nodes --all --timeout=300s
          kubectl version

      - name: End-to-end test
        run: bash deploy/k8s/tests/e2e.sh

      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl -n lab describe pods | tail -n 150
          kubectl -n lab-copilot describe pods | tail -n 80
          kubectl get events -A --sort-by=.lastTimestamp | tail -n 60
          kubectl -n lab logs deploy/console --all-containers --tail=40 || true
          for d in n8n ollama; do echo "--- $d"; kubectl -n lab-copilot logs deploy/$d --tail=40 || true; done
          kubectl -n lab logs deploy/glm-serve --tail=40 || true

  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: n8n workflow tests (generated workflow up to date, policy, Code nodes, connect_console.py)
        run: |
          node deploy/n8n/build_workflow.js --check
          node deploy/n8n/policy.test.js
          node deploy/n8n/workflow.test.js
          python3 -m unittest discover -s deploy/n8n -v
          # the console's tests that need node, which the image does not have (they skip there): the hints read names as
          # the gate does, the saved engagement through the real gate, the GUI's own code (app.js) on runs and hints, and
          # tab 4 Pentest: the scripts parse, its own code on a stand-in page (test_gui_tabs); the model pickers and the
          # layer field (test_gui_models)
          (cd app/tests && python3 -m unittest -v -k test_hint_coverage -k test_n8n_ -k test_gui_ test_engagement test_copilot_runs test_gui_tabs test_gui_models)

      - name: Build the console image (CPU torch)
        run: docker build -f deploy/Dockerfile --build-arg TORCH_FLAVOR=cpu -t ghcr.io/thrizzo/redteam-llm-lab:ci .

      - name: Unit tests (inside the built image)
        run: |
          run() { docker run --rm --entrypoint /opt/venv/bin/python -w /app ghcr.io/thrizzo/redteam-llm-lab:ci "$@"; }
          run -m unittest discover -s abliterate/tests -t . -v
          run -m unittest discover -s copilot/tests -t . -v
          run -m unittest discover -s app/tests -v

      - name: Install kind
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSLo "$HOME/bin/kind" https://github.com/kubernetes-sigs/kind/releases/download/v0.27.0/kind-linux-amd64
          chmod +x "$HOME/bin/kind"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Create the cluster, install Calico, load the image
        run: |
          kind create cluster --name lab --config deploy/k8s/tests/kind-config.yaml --wait 0s
          kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.29.1/manifests/calico.yaml
          kubectl -n kube-system rollout status daemonset/calico-node --timeout=300s
          kubectl wait --for=condition=Ready nodes --all --timeout=300s
          kind load docker-image ghcr.io/thrizzo/redteam-llm-lab:ci --name lab
          docker image ls ghcr.io/thrizzo/redteam-llm-lab:ci

      - name: Pipeline end-to-end test
        run: bash deploy/k8s/tests/pipeline-e2e.sh

      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pods,jobs -A -o wide
          kubectl -n lab describe pods | tail -n 200
          kubectl get events -A --sort-by=.lastTimestamp | tail -n 60
          kubectl -n lab logs deploy/console -c app --tail=80 || true
          for p in $(kubectl -n lab get pods -l app=lab-job -o name); do echo "--- $p"; kubectl -n lab logs "$p" --tail=40 || true; done
          kubectl -n lab logs deploy/glm-serve --tail=60 || true

  k3s:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Parse rancher-dev.ps1 (PowerShell's own parser; ASCII only, for Windows PowerShell 5.1)
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          $path = Join-Path $PWD 'deploy/k8s/tests/rancher-dev.ps1'
          [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count) { $errors | ForEach-Object { "line $($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
          $bad = Select-String -Path $path -Pattern '[^\x00-\x7F]'
          if ($bad) { $bad; 'non-ASCII: Windows PowerShell 5.1 reads scripts without a BOM as ANSI'; exit 1 }
          "parsed: $($tokens.Count) tokens, no errors, ASCII only"

      - name: rancher-dev.ps1's n8n login step with scripted answers (n8n's rules for a fresh n8n's owner account)
        shell: pwsh
        run: ./deploy/k8s/tests/test-rancher-dev-n8n.ps1

      - name: rancher-dev.ps1's port-forwards against a faked Windows (kubectl's wrapper and its child, leftovers)
        shell: pwsh
        run: ./deploy/k8s/tests/test-rancher-dev-forward.ps1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install k3d
        run: |
          curl -fsSLo k3d https://github.com/k3d-io/k3d/releases/download/v5.8.3/k3d-linux-amd64
          chmod +x k3d && sudo mv k3d /usr/local/bin/k3d
          k3d version

      - name: Create a k3s cluster (Traefik on :8081, local-path storage, k3s's network policy controller)
        run: |
          k3d cluster create lab -p "8081:80@loadbalancer" --wait --timeout 300s
          kubectl config current-context
          kubectl get nodes -o wide
          for i in $(seq 1 60); do kubectl -n kube-system get deploy traefik >/dev/null 2>&1 && break; sleep 5; done
          kubectl -n kube-system rollout status deploy/traefik --timeout=300s

      - name: Build the console image (CPU torch) and import it into k3s
        run: |
          docker build -f deploy/Dockerfile --build-arg TORCH_FLAVOR=cpu -t ghcr.io/thrizzo/redteam-llm-lab:latest .
          k3d image import ghcr.io/thrizzo/redteam-llm-lab:latest -c lab

      - name: rancher-dev.ps1 -Setup -Pipeline -Check, unattended (TEST-ONLY passwords)
        shell: pwsh
        env:
          LAB_PASSWORD: ci-only-password
          N8N_EMAIL: ci@example.com
          N8N_PASSWORD: Ci-only-pass1
        run: >-
          ./deploy/k8s/tests/rancher-dev.ps1 -Setup -Pipeline -Check -SkipBuild -NonInteractive
          -Context k3d-lab -Overlay deploy/k8s/overlays/ci-k3s -IngressUrl http://127.0.0.1:8081

      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pods,jobs -A -o wide
          kubectl -n lab describe pods | tail -n 150
          kubectl get events -A --sort-by=.lastTimestamp | tail -n 60
          kubectl -n lab logs deploy/console -c app --tail=80 || true
          for d in ollama n8n; do echo "--- $d"; kubectl -n lab-copilot logs deploy/$d --tail=30 || true; done
          kubectl get networkpolicies -A
