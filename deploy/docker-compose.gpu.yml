# GPU override: adds the NVIDIA device reservations (Docker Desktop, Linux with the NVIDIA container toolkit). On by default
# through COMPOSE_FILE in deploy/.env; app and Ollama share the GPU (the console keeps Ollama off it while a stage runs).
#   docker compose --env-file deploy/.env up -d
services:
  app:
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
  ollama:
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
