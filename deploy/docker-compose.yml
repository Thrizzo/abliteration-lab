# Abliteration Lab: app + Ollama + Caddy (basic auth).
#   cp deploy/.env.example deploy/.env             # set WORKSPACE and CADDY_HASH
#   mkdir -p <WORKSPACE>
#   GPU host (Docker Desktop, Linux + NVIDIA container toolkit):
#     docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.gpu.yml --env-file deploy/.env up -d --build
#   CPU-only (e.g. Rancher Desktop on Windows): leave the gpu file out; measure/scan will not run but the UI, datasets, SBOM and
#   Compare (with models already in Ollama) work.
#   Rancher Desktop containerd backend: nerdctl compose with the same files.
services:
  app:
    build: { context: .., dockerfile: deploy/Dockerfile }
    image: ghcr.io/thrizzo/abliteration-lab:latest   # `docker compose pull app` to use the published image instead of building
    init: true
    stop_grace_period: 60s
    environment:
      OLLAMA_HOST: http://ollama:11434
      ABL_HOST: 0.0.0.0
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ${WORKSPACE:-./workspace}:/workspace
    depends_on: [ollama]
    restart: unless-stopped
    # the app is only reachable through caddy; uncomment to expose it directly on this machine (no auth!)
    # ports: ["127.0.0.1:8787:8787"]

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_KEEP_ALIVE: 5m
    volumes:
      - ${OLLAMA_STORE:-ollama}:/root/.ollama    # a bare name = named volume; a path = bind mount
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
      # for TLS with a public hostname also publish 80/443 and put the hostname into the Caddyfile:
      # - "80:80"
      # - "443:443"
      # - "443:443/udp"
    environment:
      CADDY_USER: ${CADDY_USER:-admin}
      CADDY_HASH: "${CADDY_HASH:?CADDY_HASH is empty - see deploy/.env.example}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]
    restart: unless-stopped

volumes:
  ollama: {}
  caddy_data: {}
