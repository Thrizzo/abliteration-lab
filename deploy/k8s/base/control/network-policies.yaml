# lab-control: deny everything, then open exactly what the lab uses. Policies select pods by the "lab-role" label.
# Needs a network plugin that enforces NetworkPolicy (RKE2 Canal, Calico, Cilium; see deploy/k8s/README.md).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny, namespace: lab-control }
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-dns, namespace: lab-control }
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
---
# console: reached only by the ingress controller (adjust the namespaces to where yours runs) on the login port.
# It talks to n8n, Qdrant, Ollama and the model server, and to 443/6443 for the Kubernetes API (kill/isolate) and
# Hugging Face downloads of small models (moves into download Jobs in phase 2).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: console, namespace: lab-control }
spec:
  podSelector: { matchLabels: { lab-role: console } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - { key: kubernetes.io/metadata.name, operator: In, values: [kube-system, ingress-nginx, traefik] }
      ports: [{ port: 8080, protocol: TCP }]
  egress:
    - to: [{ podSelector: { matchLabels: { lab-role: n8n } } }]
      ports: [{ port: 5678, protocol: TCP }]
    - to: [{ podSelector: { matchLabels: { lab-role: qdrant } } }]
      ports: [{ port: 6333, protocol: TCP }]
    - to: [{ podSelector: { matchLabels: { lab-role: ollama } } }]
      ports: [{ port: 11434, protocol: TCP }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: lab-model } }
          podSelector: { matchLabels: { lab-role: glm-serve } }
      ports: [{ port: 8000, protocol: TCP }, { port: 11434, protocol: TCP }]
    - to: [{ ipBlock: { cidr: 0.0.0.0/0 } }]
      ports: [{ port: 443, protocol: TCP }, { port: 6443, protocol: TCP }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: n8n, namespace: lab-control }
spec:
  podSelector: { matchLabels: { lab-role: n8n } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{ podSelector: { matchLabels: { lab-role: console } } }]
      ports: [{ port: 5678, protocol: TCP }]
  egress:
    - to: [{ podSelector: { matchLabels: { lab-role: qdrant } } }]
      ports: [{ port: 6333, protocol: TCP }]
    - to: [{ podSelector: { matchLabels: { lab-role: ollama } } }]
      ports: [{ port: 11434, protocol: TCP }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: lab-model } }
          podSelector: { matchLabels: { lab-role: glm-serve } }
      ports: [{ port: 8000, protocol: TCP }, { port: 11434, protocol: TCP }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: qdrant, namespace: lab-control }
spec:
  podSelector: { matchLabels: { lab-role: qdrant } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { lab-role: console } }
        - podSelector: { matchLabels: { lab-role: n8n } }
      ports: [{ port: 6333, protocol: TCP }]
---
# Ollama (judge, embeddings) pulls its models from the internet on start: the only open egress in this namespace
# besides the console's. Plain NetworkPolicy cannot filter by host name; use an egress proxy or FQDN policies to narrow it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: ollama, namespace: lab-control }
spec:
  podSelector: { matchLabels: { lab-role: ollama } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { lab-role: console } }
        - podSelector: { matchLabels: { lab-role: n8n } }
      ports: [{ port: 11434, protocol: TCP }]
  egress:
    - to: [{ ipBlock: { cidr: 0.0.0.0/0 } }]
      ports: [{ port: 443, protocol: TCP }]
