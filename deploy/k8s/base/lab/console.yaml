# The console: the lab app (abliteration GUI) plus a Caddy sidecar that does the login.
# - The app binds 127.0.0.1:8787 and is only reachable through Caddy on :8080 (basic auth, Secret "basic-auth").
# - ABL_RUNNER=k8s: every pipeline stage runs as a Job in this namespace (app/k8sjobs.py, settings: ConfigMap lab-jobs),
#   on the same workspace volume, so the GUI shows runs, charts and logs exactly as with a local run.
apiVersion: v1
kind: ServiceAccount
metadata: { name: console, namespace: lab }
# Its permissions (run Jobs, read their logs, Promote, Kill / Isolate glm-serve) are in console-rbac.yaml.
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: console, namespace: lab, labels: { app: console } }
spec:
  replicas: 1
  strategy: { type: Recreate }                    # one console per workspace
  selector: { matchLabels: { app: console } }
  template:
    metadata:
      labels: { app: console, lab-role: console }  # network policies select lab-role, never app
    spec:
      serviceAccountName: console
      imagePullSecrets: [{ name: ghcr }]          # the image is private: see deploy/k8s/README.md
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch        # no recursive chown of a large volume on every start
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: ghcr.io/thrizzo/redteam-llm-lab:latest
          imagePullPolicy: Always
          env:
            - { name: ABL_HOST, value: "127.0.0.1" }                         # only Caddy (same pod) reaches it
            - { name: ABL_RUNNER, value: k8s }
            - { name: LAB_JOBS_SETTINGS, value: /etc/lab/jobs.json }
            - { name: LAB_STATE_DIR, value: /var/lib/lab }                  # the console's copy of glm-serve-allow
            - { name: OLLAMA_HOST, value: "http://ollama.lab-copilot.svc:11434" }
            - { name: QDRANT_URL, value: "http://qdrant.lab-copilot.svc:6333" }
            - { name: RAG_COLLECTION, value: writeups }
            - { name: RAG_EMBED_MODEL, value: nomic-embed-text }
            - { name: N8N_URL, value: "http://n8n.lab-copilot.svc:5678" }
            - { name: GLM_SERVE_URL, value: "http://glm-serve.lab.svc:8000" }
            - { name: HF_TOKEN, valueFrom: { secretKeyRef: { name: hf, key: token, optional: true } } }
          volumeMounts:
            - { name: workspace, mountPath: /workspace }
            - { name: lab-jobs, mountPath: /etc/lab, readOnly: true }
            - { name: console-state, mountPath: /var/lib/lab }
          resources:
            requests: { cpu: "1", memory: 4Gi }
            limits: { memory: 16Gi }              # the in-process layer lab loads small models (GLM-Edge-1.5B: ~7 GB in float32)
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          startupProbe:
            exec: { command: [curl, -fsS, "http://127.0.0.1:8787/healthz"] }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: { command: [curl, -fsS, "http://127.0.0.1:8787/healthz"] }
            periodSeconds: 20
            timeoutSeconds: 5
          livenessProbe:
            exec: { command: [curl, -fsS, "http://127.0.0.1:8787/healthz"] }
            periodSeconds: 60
            timeoutSeconds: 5
        - name: login
          image: caddy:2.11.9
          args: [caddy, run, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
          env:
            - { name: CADDY_USER, valueFrom: { secretKeyRef: { name: basic-auth, key: user } } }
            - { name: CADDY_HASH, valueFrom: { secretKeyRef: { name: basic-auth, key: hash } } }
            - { name: XDG_CONFIG_HOME, value: /tmp/caddy/config }
            - { name: XDG_DATA_HOME, value: /tmp/caddy/data }
          ports: [{ containerPort: 8080, name: http }]
          volumeMounts:
            - { name: caddyfile, mountPath: /etc/caddy, readOnly: true }
            - { name: caddy-tmp, mountPath: /tmp/caddy }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe: { tcpSocket: { port: 8080 }, periodSeconds: 10 }
      volumes:
        - { name: workspace, persistentVolumeClaim: { claimName: workspace } }
        - { name: lab-jobs, configMap: { name: lab-jobs } }
        - { name: caddyfile, configMap: { name: console-caddy } }
        - { name: caddy-tmp, emptyDir: { sizeLimit: 64Mi } }
        # Release recreates glm-serve-allow from the copy kept here, not on the workspace, which Jobs (and, in dev, the
        # model server) can write. It survives container restarts; a new pod takes a fresh copy at start.
        - { name: console-state, emptyDir: { sizeLimit: 1Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: console, namespace: lab }
spec:
  selector: { app: console }
  ports: [{ name: http, port: 8080, targetPort: http }]
