# lab-model: nothing in, nothing out, except one opening into glm-serve.
#
# Kubernetes network policies only ever ALLOW: a "deny all" policy added next to an allow policy changes nothing.
# So Isolate works by DELETING glm-serve-allow (default-deny stays), and Release re-creates it. The console's RBAC
# (console-rbac.yaml) allows exactly that and nothing else on network policies.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny, namespace: lab-model }
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: glm-serve-allow, namespace: lab-model }
spec:
  podSelector: { matchLabels: { lab-role: glm-serve } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: lab-control } }
          podSelector:
            matchExpressions:
              - { key: lab-role, operator: In, values: [console, n8n] }
      ports: [{ port: 8000, protocol: TCP }, { port: 11434, protocol: TCP }]   # vLLM; Ollama in the dev overlay
