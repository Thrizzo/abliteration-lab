# What the console may do to the model server: Kill, Isolate, Start. Nothing cluster-wide, no exec, no secrets.
#   Kill     delete networkpolicy glm-serve-allow, scale deploy/glm-serve to 0, delete its pod with grace period 0
#   Isolate  delete networkpolicy glm-serve-allow (default-deny stays, so traffic stops; the model keeps running)
#   Start    create networkpolicy glm-serve-allow, scale deploy/glm-serve to 1
# Kubernetes cannot limit pod deletes or creates by name: pods (any in lab-model) and networkpolicy create are
# namespace-wide. That is why lab-model holds only the model server (and, from phase 2, the abliteration Jobs).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: glm-serve-control, namespace: lab-model }
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [glm-serve]
    verbs: [get, watch]
  - apiGroups: [apps]
    resources: [deployments/scale]
    resourceNames: [glm-serve]
    verbs: [get, patch, update]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    resourceNames: [glm-serve-allow]
    verbs: [get, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: console-glm-serve-control, namespace: lab-model }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: glm-serve-control }
subjects:
  - { kind: ServiceAccount, name: console, namespace: lab-control }
