# Red Team LLM Lab on Kubernetes: the shared base. Deploy an overlay (deploy/k8s/overlays/<name>), not this folder.
# Layout and decisions: docs/design/glm5-k8s-console.md. How to deploy: deploy/k8s/README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs: { app.kubernetes.io/part-of: redteam-llm-lab }
    includeSelectors: false

resources:
  - namespaces.yaml
  # lab: console (lab app + login), the Jobs it starts, glm-serve, the shared workspace volume
  - lab/storage.yaml
  - lab/console.yaml
  - lab/console-rbac.yaml
  - lab/glm-serve.yaml
  - lab/ingress.yaml
  - lab/network-policies.yaml
  # lab-copilot: n8n (copilot engine), Qdrant (retrieval), Ollama (judge + embeddings)
  - copilot/n8n.yaml
  - copilot/qdrant.yaml
  - copilot/ollama.yaml
  - copilot/network-policies.yaml

generatorOptions:
  disableNameSuffixHash: true      # stable names: the console edits glm-serve's ConfigMap on Promote

configMapGenerator:
  # how the console runs pipeline stages as Jobs (image, resources and placement per stage class, serving mode).
  # Every overlay replaces it with its own jobs.json.
  - name: lab-jobs
    namespace: lab
    files:
      - jobs.json=lab/jobs.json
  # what glm-serve serves. Promote points MODEL_PATH at a run's model folder and restarts the pod.
  - name: glm-serve
    namespace: lab
    literals:
      - MODEL_PATH=/workspace/serving/current
      - SERVED_MODEL_NAME=glm-abl
      - VLLM_ARGS=--tensor-parallel-size 8 --max-model-len 32768 --gpu-memory-utilization 0.90
  # the console's login proxy (Caddy). Basic auth lives inside the pod, so it works behind any ingress controller.
  - name: console-caddy
    namespace: lab
    files:
      - lab/Caddyfile
  # the copilot's scope ceiling and default judge (copilot/copilot.env, the one place to edit them): n8n's Code nodes
  # read copilot-settings; the console reads the same values as copilot-scope, to check the engagement the GUI saves
  - name: copilot-settings
    namespace: lab-copilot
    envs:
      - copilot/copilot.env
  - name: copilot-scope
    namespace: lab
    envs:
      - copilot/copilot.env
  # models the judge/embeddings Ollama pulls when it starts, in this order (space-separated; empty = pull nothing).
  # The embedding model (~270 MB) first: knowledge uploads work while the judge (~5 GB) is still downloading.
  - name: ollama-models
    namespace: lab-copilot
    literals:
      - OLLAMA_PULL=nomic-embed-text qwen3:8b
