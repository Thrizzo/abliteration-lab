# Two namespaces:
#   lab          everything that touches the model weights: the console (lab app + login), the abliteration Jobs it
#                starts, glm-serve (the abliterated model server) and the workspace volume they share. A
#                PersistentVolumeClaim belongs to one namespace, and all of these read or write the same weights.
#   lab-copilot  the copilot's services: n8n (engine), Qdrant (retrieval), Ollama (judge + embeddings)
# The console's Kill / Isolate / Job permissions are limited to lab.
# Pod Security: baseline is enforced; restricted is reported as warnings (Ollama and vLLM run as root).
apiVersion: v1
kind: Namespace
metadata:
  name: lab
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: lab-copilot
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
