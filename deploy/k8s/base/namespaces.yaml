# Two namespaces on purpose:
#   lab-control  everything you talk to (console, n8n, Qdrant, judge/embeddings)
#   lab-model    the abliterated model server and its weights. The console's kill/isolate permissions are scoped to this
#                namespace, so nothing else that matters should run here. (Phase 2 adds the abliteration Jobs: they need
#                the same weights volume, and a PersistentVolumeClaim cannot be shared across namespaces.)
# Pod Security: baseline is enforced; restricted is reported as warnings (Ollama and n8n images need small exceptions).
apiVersion: v1
kind: Namespace
metadata:
  name: lab-control
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: lab-model
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
