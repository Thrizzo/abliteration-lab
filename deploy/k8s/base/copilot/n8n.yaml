# n8n: the copilot engine (deploy/n8n/). Not on the Ingress: open the editor with
#   kubectl -n lab-copilot port-forward svc/n8n 5678:5678      ->  http://localhost:5678
# Credentials to create in n8n (same as the compose stack, other host names):
#   Ollama (judge, embeddings)  http://ollama.lab-copilot.svc:11434
#   Qdrant                      http://qdrant.lab-copilot.svc:6333
#   operator model              http://glm-serve.lab.svc:8000   (vLLM: OpenAI credential, Base URL + /v1; dev: Ollama)
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: n8n-data, namespace: lab-copilot }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 10Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: n8n, namespace: lab-copilot, labels: { app: n8n } }
spec:
  replicas: 1
  strategy: { type: Recreate }                    # SQLite on the volume: one writer
  selector: { matchLabels: { app: n8n } }
  template:
    metadata:
      labels: { app: n8n, lab-role: n8n }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000                           # the image's "node" user
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: n8n
          image: n8nio/n8n:2.48.7                 # pinned: re-import the workflow when bumping
          envFrom: [{ configMapRef: { name: copilot-settings } }]
          env:
            - { name: N8N_ENCRYPTION_KEY, valueFrom: { secretKeyRef: { name: n8n, key: encryption-key } } }
            # the copilot reads LAB_* through $env in Code nodes; n8n 2.x blocks that by default
            - { name: N8N_BLOCK_ENV_ACCESS_IN_NODE, value: "false" }
            - { name: N8N_LISTEN_ADDRESS, value: "0.0.0.0" }
            - { name: N8N_PORT, value: "5678" }
            - { name: N8N_HOST, value: localhost }
            - { name: N8N_PROTOCOL, value: http }
            - { name: WEBHOOK_URL, value: "http://localhost:5678/" }     # form and approval links, via port-forward
            - { name: N8N_SECURE_COOKIE, value: "false" }                # plain http on the port-forward
            - { name: N8N_RUNNERS_ENABLED, value: "true" }
            - { name: N8N_DIAGNOSTICS_ENABLED, value: "false" }
            - { name: N8N_VERSION_NOTIFICATIONS_ENABLED, value: "false" }
            - { name: N8N_TEMPLATES_ENABLED, value: "false" }
            - { name: N8N_PERSONALIZATION_ENABLED, value: "false" }
            - { name: GENERIC_TIMEZONE, value: UTC }
            - { name: LAB_RUNNER_URL, value: "" }                      # no executor: the Execute node stays disabled
            # LAB_ALLOWLIST, LAB_AUTORUN_* and COPILOT_JUDGE_MODEL come from copilot-settings (envFrom above), edited in
            # base/copilot/copilot.env. The console sends its chosen models and engagement with each run; these are the
            # defaults for runs without them (the web form).
            - { name: COPILOT_OPERATOR_MODEL, value: glm-abl }            # the name glm-serve serves (Promote points it at a run)
          ports: [{ containerPort: 5678, name: http }]
          volumeMounts: [{ name: data, mountPath: /home/node/.n8n }]
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          startupProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5, failureThreshold: 60 }
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 30, failureThreshold: 6 }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: n8n-data } }
---
apiVersion: v1
kind: Service
metadata: { name: n8n, namespace: lab-copilot }
spec:
  selector: { app: n8n }
  ports: [{ name: http, port: 5678, targetPort: http }]
