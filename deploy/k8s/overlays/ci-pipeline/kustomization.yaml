# CI only (.github/workflows/k8s-e2e.yml, job "pipeline"): the dev overlay with the REAL console image, built from this
# commit (CPU torch) and loaded into kind as ghcr.io/thrizzo/redteam-llm-lab:ci. The test drives download, scan, apply,
# validate and deploy through the console's API on a tiny random GLM, then Promote and Rollback.
# TEST-ONLY secrets below. Never use this overlay for a real deployment.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../dev
images:
  - name: ghcr.io/thrizzo/redteam-llm-lab
    newTag: ci
patches:
  - path: small.yaml
configMapGenerator:
  - name: lab-jobs
    namespace: lab
    behavior: replace
    files:
      - jobs.json
  - name: ollama-models
    namespace: lab-copilot
    behavior: replace
    literals: [OLLAMA_PULL=]
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  - name: basic-auth
    namespace: lab
    literals:
      - user=ci
      - hash=$2b$10$VJt/mXFY99jLajdn2EX9fea6mqH7iziQINYuyeKAzOT77t/twjrcC   # bcrypt of "ci-only-password"
  - name: n8n
    namespace: lab-copilot
    literals:
      - encryption-key=ci-only-not-a-secret
