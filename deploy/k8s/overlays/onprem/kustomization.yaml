# On-prem cluster (e.g. RKE2) with your own 8×H200/B200-class node and NVIDIA GPU Operator.
#   kubectl apply -k deploy/k8s/overlays/onprem
# Edit the values marked EDIT in patches.yaml first (storage class, host name, ingress class).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
components:
  - ../../components/gpu-node
patches:
  - path: patches.yaml
