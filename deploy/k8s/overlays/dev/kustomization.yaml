# Phase 0: the whole stack on a small cluster without GPUs (Rancher Desktop's k3s, kind, a spare VM).
#   kubectl apply -k deploy/k8s/overlays/dev
# Same namespaces, policies, RBAC and kill/isolate path as the GPU overlays; only the model server differs: glm-serve
# runs Ollama with a small abliterated model (e.g. GLM-Edge-1.5B from the lab app's Compare stage) instead of vLLM.
# Clients still use glm-serve.lab-model.svc:8000 (in n8n: an Ollama credential with that Base URL).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - path: sizes.yaml
  - target: { kind: Deployment, name: glm-serve }
    path: glm-serve-ollama.yaml
  # the lab app imports the models it abliterates into glm-serve (its Compare stage talks to OLLAMA_HOST)
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: console, namespace: lab-control }
      spec:
        template:
          spec:
            containers:
              - name: app
                env:
                  - { name: OLLAMA_HOST, value: "http://glm-serve.lab-model.svc:8000" }
