# kind cluster for the e2e test: kind's default network plugin does not enforce NetworkPolicy, so it is switched off
# and Calico is installed instead (same pod range as Calico's default pool).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
nodes:
  - role: control-plane
